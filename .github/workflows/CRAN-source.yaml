name: CRAN-source

on:
  push:
    branches: [feat/cuenca-cran]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_FORCE_SUGGESTS_: false
      _R_CHECK_CRAN_INCOMING_: true
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: Build and check the exact submission tarball
        shell: Rscript {0}
        run: |
          out <- file.path(Sys.getenv("RUNNER_TEMP"), "AirEcuador-CRAN")
          dir.create(out, recursive = TRUE, showWarnings = FALSE)
          tarball <- pkgbuild::build(".", dest_path = out,
                                     args = "--no-manual")
          rcmdcheck::rcmdcheck(tarball,
                              args = c("--as-cran", "--no-manual"),
                              error_on = "warning",
                              check_dir = file.path(out, "check"))
          cat("CHECKED-SOURCE:", basename(tarball), "\n")
          print(tools::md5sum(tarball))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AirEcuador-0.3.0-CRAN-source
          path: ${{ runner.temp }}/AirEcuador-CRAN
          if-no-files-found: error
          retention-days: 30
